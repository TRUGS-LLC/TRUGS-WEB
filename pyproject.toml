[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trugs-web"
version = "2.1.0"
description = "Describe folders, query TRUGS graphs and build research graphs from web sources."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "TRUGS LLC" }]
keywords = ["trugs", "web", "crawler", "knowledge-graph", "research", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# Uses the language core and graph store.
dependencies = [
    "trugs-tools>=2.4.0,<3.0.0",
    # Declared even though nothing in this package imports it directly: trugs-tools
    # requires trugs-store and declares it unbounded, so this line is what carries
    # the upper bound for trugs-store. Removing it would silently un-bound it.
    "trugs-store>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
web = ["httpx>=0.24", "beautifulsoup4>=4.9", "lxml>=4.9"]
llm = ["anthropic>=0.7", "openai>=1.0"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.20",
    "respx>=0.20",
    "jsonschema>=4",
    "httpx>=0.24",
    "beautifulsoup4>=4.9",
]

[project.scripts]
trugs-web = "trugs_web.cli:main"

[project.urls]
Homepage = "https://github.com/TRUGS-LLC/TRUGS-WEB"
Issues = "https://github.com/TRUGS-LLC/TRUGS-WEB/issues"
Documentation = "https://github.com/TRUGS-LLC/TRUGS-WEB/blob/main/ARCHITECTURE.md"
Changelog = "https://github.com/TRUGS-LLC/TRUGS-WEB/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE", "NOTICE"]   # dists carry the Apache license + attribution NOTICE

[tool.setuptools.packages.find]
where = ["src"]
include = ["trugs_web*"]

[tool.setuptools.package-data]
trugs_web = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "robots: crawler robots.txt / politeness behavior",
    "rate_limit: crawler rate-limit / backoff behavior",
    "cost: LLM cost-guard / budget behavior",
    "secret: API-key-from-environment behavior",
    "logging: structured logging / error-context behavior",
    "graph_validation_e2e: end-to-end TRUG build + validate_trug() check",
]

[tool.ruff.lint]
# Pin the rule selection explicitly rather than inheriting ruff's default.
# CI installs ruff unpinned (`pip install ruff`), and ruff broadened its DEFAULT
# selection after this repo's last green run — which turned the tree red without a
# line of code changing (75 errors on main, I001/UP/SIM/DTZ/RUF). This is the set the
# code was actually written against, and stating it means the next ruff release
# cannot silently redefine what "lint passes" means here.
#
# Adopting the broader set is a fine idea, but it is a code change (~15 findings need
# manual work, including timezone-naive datetime usage) and belongs in its own PR.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]   # tests may import after module-level setup

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["trugs_store", "trugs_store.*", "trugs_tools", "trugs_tools.*", "httpx", "bs4", "anthropic", "openai", "respx"]
ignore_missing_imports = true
